<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Khourouj Tabligh</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @media print { .no-print { display: none !important; } body { background: white !important; } }
    .debug-box { display: none; background: #dc2626; color: white; padding: 15px; font-weight: bold; text-align: center; font-family: sans-serif; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen font-sans">

  <!-- ZONE D'ERREUR ROUGE -->
  <div id="debug-box" class="debug-box"></div>

  <header class="bg-emerald-700 text-white shadow-lg">
    <div class="max-w-6xl mx-auto px-4 py-4">
      <h1 class="text-xl md:text-2xl font-bold">🕌 Khourouj Tabligh</h1>
      <p class="text-emerald-100 text-sm">Gestion des sorties de 3 jours</p>
    </div>
  </header>

  <nav class="bg-white border-b shadow-sm no-print">
    <div class="max-w-6xl mx-auto px-4 flex">
      <button id="tab-consult" class="px-4 py-3 font-medium border-b-2 border-emerald-600 text-emerald-700">Consultation</button>
      <button id="tab-admin" class="px-4 py-3 font-medium border-b-2 border-transparent text-gray-500">Gestionnaire (bientôt)</button>
    </div>
  </nav>

  <main class="max-w-6xl mx-auto px-4 py-6">
    <section id="view-consult">
      <div class="bg-white rounded-lg shadow p-4 md:p-6 mb-6">
        <h2 class="text-lg font-semibold mb-4">🔎 Filtrer les sorties</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
          
          <div>
            <label class="block text-sm font-medium mb-1">Année</label>
            <select id="sel-annee" class="w-full border rounded px-3 py-2 bg-white"></select>
          </div>
          
          <div>
            <label class="block text-sm font-medium mb-1">Mois</label>
            <select id="sel-mois" class="w-full border rounded px-3 py-2 bg-white"></select>
          </div>
          
          <div>
            <label class="block text-sm font-medium mb-1">Pays</label>
            <select id="sel-pays" class="w-full border rounded px-3 py-2 bg-white">
              <option value="">Chargement de la base...</option>
            </select>
          </div>
          
          <div>
            <label class="block text-sm font-medium mb-1">Ville</label>
            <select id="sel-ville" class="w-full border rounded px-3 py-2 bg-white">
              <option value="">--</option>
            </select>
          </div>
          
          <div>
            <label class="block text-sm font-medium mb-1">Halaka</label>
            <select id="sel-halaka" class="w-full border rounded px-3 py-2 bg-white">
              <option value="">--</option>
            </select>
          </div>

        </div>
      </div>

      <div class="bg-white rounded-lg shadow overflow-hidden">
        <div id="planning-empty" class="p-8 text-center text-gray-500">Sélectionnez un pays, une ville puis une halaka pour afficher le planning.</div>
        <div id="planning-content" class="hidden">
          <div class="p-4 md:p-6 border-b bg-emerald-50">
            <h2 id="planning-title" class="text-lg md:text-xl font-bold text-emerald-800"></h2>
            <p id="planning-subtitle" class="text-sm text-emerald-700"></p>
          </div>
          <div id="print-area">
            <table class="w-full text-sm">
              <thead class="bg-gray-100">
                <tr>
                  <th class="text-left p-3 font-semibold">Mosquée</th>
                  <th class="text-center p-3 font-semibold">Ousboue</th>
                  <th class="text-center p-3 font-semibold">Vendredi → Dimanche</th>
                  <th class="text-center p-3 font-semibold">Statut</th>
                </tr>
              </thead>
              <tbody id="planning-tbody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script>
    function showError(msg) {
      const box = document.getElementById('debug-box');
      box.style.display = 'block';
      box.innerHTML = "⚠️ " + msg;
    }

    const MONTHS = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
    
    const yearSel = document.getElementById('sel-annee');
    const curYear = new Date().getFullYear();
    yearSel.innerHTML = '';
    for (let y = curYear - 1; y <= curYear + 1; y++) {
      const o = document.createElement('option');
      o.value = y; o.textContent = y;
      if (y === curYear) o.selected = true;
      yearSel.appendChild(o);
    }

    const monthSel = document.getElementById('sel-mois');
    monthSel.innerHTML = '';
    MONTHS.forEach((m, i) => {
      const o = document.createElement('option');
      o.value = i + 1; o.textContent = m;
      if (i === new Date().getMonth()) o.selected = true;
      monthSel.appendChild(o);
    });

    function loadSupabase() {
      const script = document.createElement('script');
      script.src = "https://unpkg.com/@supabase/supabase-js@2";
      
      script.onload = () => {
        try {
          const SUPABASE_URL = 'https://rhtaqusrkgqawtbqysgw.supabase.co';
          const SUPABASE_ANON_KEY = 'sb_publishable_JIjs3oxZszYHTaON8iH06g_-mnoCVfl';
          
          const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
          let dataCache = { pays: [], villes: [], halakat: [], mosquees: [] };

          async function fetchData() {
            try {
              const { data: pays, error: e1 } = await supabase.from('pays').select('*');
              if (e1) throw e1;

              const { data: villes, error: e2 } = await supabase.from('villes').select('*');
              if (e2) throw e2;

              const { data: halakat, error: e3 } = await supabase.from('halakat').select('*');
              if (e3) throw e3;

              const { data: mosquees, error: e4 } = await supabase.from('mosquees').select('*');
              if (e4) throw e4;

              dataCache = { pays: pays || [], villes: villes || [], halakat: halakat || [], mosquees: mosquees || [] };
              
              const paysSel = document.getElementById('sel-pays');
              paysSel.innerHTML = '<option value="">-- Choisir un pays --</option>' + 
                dataCache.pays.map(p => `<option value="${p.id}">${p.nom}</option>`).join('');

            } catch (err) {
              showError("Erreur de base de données : " + err.message + ". Avez-vous bien exécuté le code SQL dans Supabase ?");
            }
          }
          
          fetchData();

          document.getElementById('sel-pays').addEventListener('change', function() {
            const paysId = this.value;
            const villeSel = document.getElementById('sel-ville');
            villeSel.innerHTML = '<option value="">-- Choisir une ville --</option>';
            document.getElementById('sel-halaka').innerHTML = '<option value="">--</option>';
            
            if (!paysId) return;
            dataCache.villes.filter(v => String(v.pays_id) === paysId).forEach(v => {
              villeSel.insertAdjacentHTML('beforeend', `<option value="${v.id}">${v.nom}</option>`);
            });
          });

          document.getElementById('sel-ville').addEventListener('change', function() {
            const villeId = this.value;
            const halakaSel = document.getElementById('sel-halaka');
            halakaSel.innerHTML = '<option value="">-- Choisir une halaka --</option>';
            
            if (!villeId) return;
            dataCache.halakat.filter(h => String(h.ville_id) === villeId).forEach(h => {
              halakaSel.insertAdjacentHTML('beforeend', `<option value="${h.id}">${h.nom}</option>`);
            });
          });

          document.getElementById('sel-halaka').addEventListener('change', function() {
            const halakaId = this.value;
            if (!halakaId) return;
            
            const year = +document.getElementById('sel-annee').value;
            const month = +document.getElementById('sel-mois').value;
            
            const halaka = dataCache.halakat.find(h => String(h.id) === halakaId);
            const ville = dataCache.villes.find(v => String(v.id) === String(halaka.ville_id));
            const pays = dataCache.pays.find(p => String(p.id) === String(ville.pays_id));
            
            const mosquees = dataCache.mosquees.filter(m => String(m.halaka_id) === halakaId);

            document.getElementById('planning-empty').classList.add('hidden');
            document.getElementById('planning-content').classList.remove('hidden');
            document.getElementById('planning-title').textContent = `${halaka.nom} — ${ville.nom}, ${pays.nom}`;
            document.getElementById('planning-subtitle').textContent = `Programme de ${MONTHS[month - 1]} ${year}`;
            
            const tbody = document.getElementById('planning-tbody');
            tbody.innerHTML = '';
            
            if (mosquees.length === 0) {
              tbody.innerHTML = '<tr><td colspan="4" class="p-6 text-center">Aucune mosquée.</td></tr>';
              return;
            }
            
            mosquees.sort((a,b) => a.ousboue - b.ousboue).forEach(m => {
              tbody.insertAdjacentHTML('beforeend', `
                <tr class="border-t">
                  <td class="p-3 font-medium">${m.nom}</td>
                  <td class="p-3 text-center">Ousboue ${m.ousboue}</td>
                  <td class="p-3 text-center text-gray-500">À calculer (semaine ${m.ousboue})</td>
                  <td class="p-3 text-center"><span class="bg-emerald-100 text-emerald-800 px-2 py-1 rounded text-xs">Prévue</span></td>
                </tr>
              `);
            });
          });

        } catch (err) {
          showError("Erreur d'initialisation de Supabase : " + err.message);
        }
      };

      script.onerror = () => {
        showError("Votre réseau bloque le chargement de la base de données Supabase (CDN bloqué). Essayez avec un autre réseau Wi-Fi ou désactivez un bloqueur de publicité.");
      };

      document.body.appendChild(script);
    }

    loadSupabase();
  </script>
</body>
</html>
