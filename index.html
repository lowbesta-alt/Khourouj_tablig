<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Khourouj Tabligh</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @media print { .no-print { display: none !important; } body { background: white !important; } }
    .debug-box { display: none; background: #dc2626; color: white; padding: 15px; font-weight: bold; text-align: center; font-family: sans-serif; position: fixed; top: 0; width: 100%; z-index: 9999;}
    
    /* Styles pour les menus pliables (accordéons) */
    details > summary { list-style: none; cursor: pointer; }
    details > summary::-webkit-details-marker { display: none; }
    details[open] .icon-plus { display: none; }
    details[open] .icon-minus { display: inline; }
    .icon-minus { display: none; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen font-sans">

  <div id="debug-box" class="debug-box"></div>

  <header class="bg-emerald-700 text-white shadow-lg no-print">
    <div class="max-w-6xl mx-auto px-4 py-4">
      <h1 class="text-xl md:text-2xl font-bold">🕌 Khourouj Tabligh</h1>
      <p class="text-emerald-100 text-sm">Gestion des sorties de 3 jours</p>
    </div>
  </header>

  <nav class="bg-white border-b shadow-sm no-print">
    <div class="max-w-6xl mx-auto px-4 flex">
      <button id="tab-consult" onclick="switchTab('consult')" class="px-4 py-3 font-medium border-b-2 border-emerald-600 text-emerald-700">Consultation</button>
      <button id="tab-admin" onclick="switchTab('admin')" class="px-4 py-3 font-medium border-b-2 border-transparent text-gray-500 hover:text-gray-800">Gestionnaire</button>
    </div>
  </nav>

  <main class="max-w-6xl mx-auto px-4 py-6">
    
    <section id="view-consult">
      <div class="bg-white rounded-lg shadow p-4 md:p-6 mb-6 no-print">
        <h2 class="text-lg font-semibold mb-4">🔎 Filtrer les sorties</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
          <div><label class="block text-sm font-medium mb-1">Année</label><select id="sel-annee" class="w-full border rounded px-3 py-2 bg-white"></select></div>
          <div><label class="block text-sm font-medium mb-1">Mois</label><select id="sel-mois" class="w-full border rounded px-3 py-2 bg-white"></select></div>
          <div><label class="block text-sm font-medium mb-1">Pays</label><select id="sel-pays" class="w-full border rounded px-3 py-2 bg-white"></select></div>
          
          <!-- NOUVEAU NOM : Ville (Halaka) -->
          <div><label class="block text-sm font-medium mb-1">Ville (Halaka)</label><select id="sel-ville" class="w-full border rounded px-3 py-2 bg-white"></select></div>
          
          <!-- NOUVEAU NOM : Sous-Halaka -->
          <div><label class="block text-sm font-medium mb-1">Sous-Halaka (Secteur)</label><select id="sel-halaka" class="w-full border rounded px-3 py-2 bg-white"></select></div>
        </div>
      </div>

      <div class="bg-white rounded-lg shadow overflow-hidden">
        <div id="planning-empty" class="p-8 text-center text-gray-500">Sélectionnez un pays, une ville (halaka) puis un sous-halaka pour afficher le planning.</div>
        <div id="planning-content" class="hidden">
          <div class="p-4 md:p-6 border-b bg-emerald-50">
            <h2 id="planning-title" class="text-lg md:text-xl font-bold text-emerald-800"></h2>
            <p id="planning-subtitle" class="text-sm text-emerald-700"></p>
            <div class="mt-3 flex flex-wrap gap-2 no-print">
              <button id="btn-whatsapp" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded text-sm font-medium">📱 Copier pour WhatsApp</button>
              <button id="btn-print" class="bg-gray-700 hover:bg-gray-800 text-white px-4 py-2 rounded text-sm font-medium">🖨️ Imprimer / PDF</button>
            </div>
          </div>
          <div id="print-area">
            <table class="w-full text-sm">
              <thead class="bg-gray-100">
                <tr>
                  <th class="text-left p-3 font-semibold">Mosquée</th>
                  <th class="text-center p-3 font-semibold">Ousboue</th>
                  <th class="text-center p-3 font-semibold">Vendredi → Dimanche</th>
                  <th class="text-center p-3 font-semibold">Statut</th>
                </tr>
              </thead>
              <tbody id="planning-tbody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </section>

    <section id="view-admin" class="hidden"></section>

  </main>

  <script>
    function showError(msg) {
      const box = document.getElementById('debug-box');
      box.style.display = 'block';
      box.innerHTML = "⚠️ " + msg;
    }

    const MONTHS = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
    function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

    function getNthFriday(year, month, n) { 
      const first = new Date(year, month - 1, 1); 
      const firstDow = first.getDay(); 
      const daysUntilFri = (5 - firstDow + 7) % 7; 
      const day = 1 + daysUntilFri + (n - 1) * 7; 
      return new Date(year, month - 1, day); 
    }
    function getOusboueDates(year, month, ousboue) { 
      const friday = getNthFriday(year, month, ousboue); 
      const sunday = new Date(friday); 
      sunday.setDate(friday.getDate() + 2); 
      return { friday, sunday }; 
    }
    function getStatus(friday, sunday) { 
      const today = new Date(); today.setHours(0,0,0,0); 
      const f = new Date(friday); f.setHours(0,0,0,0); 
      const s = new Date(sunday); s.setHours(23,59,59,999); 
      if (today > s) return { label: 'Terminée', cls: 'bg-gray-200 text-gray-700' }; 
      if (today >= f) return { label: 'En cours', cls: 'bg-orange-100 text-orange-800' }; 
      return { label: 'À venir', cls: 'bg-emerald-100 text-emerald-800' }; 
    }
    function formatLongDate(d) { 
      return d.toLocaleDateString('fr-FR', { weekday: 'short', day: '2-digit', month: 'long', year: 'numeric' }); 
    }

    const yearSel = document.getElementById('sel-annee'); const curYear = new Date().getFullYear();
    yearSel.innerHTML = ''; for (let y = curYear - 1; y <= curYear + 1; y++) { const o = document.createElement('option'); o.value = y; o.textContent = y; if (y === curYear) o.selected = true; yearSel.appendChild(o); }
    const monthSel = document.getElementById('sel-mois'); monthSel.innerHTML = '';
    MONTHS.forEach((m, i) => { const o = document.createElement('option'); o.value = i + 1; o.textContent = m; if (i === new Date().getMonth()) o.selected = true; monthSel.appendChild(o); });

    const script = document.createElement('script');
    script.src = "https://unpkg.com/@supabase/supabase-js@2";
    
    script.onload = () => {
      try {
        const SUPABASE_URL = 'https://rhtaqusrkgqawtbqysgw.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_JIjs3oxZszYHTaON8iH06g_-mnoCVfl';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        let dataCache = { pays: [], villes: [], halakat: [], mosquees: [] };

        async function loadData() {
          const { data: pays, error: e1 } = await supabase.from('pays').select('*');
          const { data: villes, error: e2 } = await supabase.from('villes').select('*');
          const { data: halakat, error: e3 } = await supabase.from('halakat').select('*');
          const { data: mosquees, error: e4 } = await supabase.from('mosquees').select('*');
          
          if (e1 || e2 || e3 || e4) { showError("Erreur de base de données. Avez-vous exécuté le code SQL ?"); return; }
          dataCache = { pays: pays || [], villes: villes || [], halakat: halakat || [], mosquees: mosquees || [] };
        }

        async function reloadDataAndRefresh() {
          await loadData(); refreshConsultationSelects(); renderAdminLists(); renderPlanning();
        }

        function refreshConsultationSelects() {
          const paysSel = document.getElementById('sel-pays'); const prev = paysSel.value;
          paysSel.innerHTML = '<option value="">-- Choisir un pays --</option>' + dataCache.pays.map(p => `<option value="${p.id}">${escapeHtml(p.nom)}</option>`).join('');
          if (prev && dataCache.pays.some(p => String(p.id) === prev)) { paysSel.value = prev; onPaysChange(); } 
          else { document.getElementById('sel-ville').innerHTML = '<option value="">-- Choisir une ville --</option>'; document.getElementById('sel-halaka').innerHTML = '<option value="">-- Choisir un sous-halaka --</option>'; hidePlanning(); }
        }

        window.onPaysChange = function() {
          const paysId = document.getElementById('sel-pays').value;
          document.getElementById('sel-ville').innerHTML = '<option value="">-- Choisir une ville (Halaka) --</option>'; document.getElementById('sel-halaka').innerHTML = '<option value="">-- Choisir un sous-halaka --</option>'; hidePlanning();
          if (!paysId) return;
          dataCache.villes.filter(v => String(v.pays_id) === paysId).forEach(v => { document.getElementById('sel-ville').insertAdjacentHTML('beforeend', `<option value="${v.id}">${escapeHtml(v.nom)}</option>`); });
        };

        window.onVilleChange = function() {
          const villeId = document.getElementById('sel-ville').value;
          document.getElementById('sel-halaka').innerHTML = '<option value="">-- Choisir un sous-halaka --</option>'; hidePlanning();
          if (!villeId) return;
          dataCache.halakat.filter(h => String(h.ville_id) === villeId).forEach(h => { document.getElementById('sel-halaka').insertAdjacentHTML('beforeend', `<option value="${h.id}">${escapeHtml(h.nom)}</option>`); });
        };

        function hidePlanning() { document.getElementById('planning-empty').classList.remove('hidden'); document.getElementById('planning-content').classList.add('hidden'); }

        window.renderPlanning = function() {
          const halakaId = document.getElementById('sel-halaka').value; if (!halakaId) return hidePlanning();
          const year = +document.getElementById('sel-annee').value; const month = +document.getElementById('sel-mois').value;
          const halaka = dataCache.halakat.find(h => String(h.id) === halakaId); const ville = dataCache.villes.find(v => String(v.id) === String(halaka.ville_id)); const pays = dataCache.pays.find(p => String(p.id) === String(ville.pays_id));
          const mosquees = dataCache.mosquees.filter(m => String(m.halaka_id) === halakaId).sort((a, b) => a.ousboue - b.ousboue || a.nom.localeCompare(b.nom));
          
          document.getElementById('planning-empty').classList.add('hidden'); document.getElementById('planning-content').classList.remove('hidden');
          document.getElementById('planning-title').textContent = `${ville.nom} (Halaka) — ${halaka.nom}`;
          document.getElementById('planning-subtitle').textContent = `Programme de ${MONTHS[month - 1]} ${year} | ${pays.nom}`;
          
          const tbody = document.getElementById('planning-tbody'); tbody.innerHTML = '';
          if (mosquees.length === 0) { tbody.innerHTML = '<tr><td colspan="4" class="p-6 text-center text-gray-500">Aucune mosquée.</td></tr>'; return; }
          
          mosquees.forEach(m => {
            const { friday, sunday } = getOusboueDates(year, month, m.ousboue); const st = getStatus(friday, sunday);
            tbody.insertAdjacentHTML('beforeend', `<tr class="border-t"><td class="p-3"><div class="font-medium">${escapeHtml(m.nom)}</div>${m.responsable ? `<div class="text-xs text-gray-500">${escapeHtml(m.responsable)}${m.contact ? ' · ' + escapeHtml(m.contact) : ''}</div>` : ''}</td><td class="p-3 text-center">Ousboue ${m.ousboue}</td><td class="p-3 text-center">${formatLongDate(friday)} → ${formatLongDate(sunday)}</td><td class="p-3 text-center"><span class="inline-block px-2 py-1 rounded text-xs font-medium ${st.cls}">${st.label}</span></td></tr>`);
          });
        };

        // ================= ADMIN AVEC MENUS PLIABLES ET TEXTES CLAIRS =================
        window.initAdmin = function() {
          document.getElementById('view-admin').innerHTML = `
            <div class="mb-4 bg-blue-50 text-blue-800 p-3 rounded text-sm">
              <strong>Rappel de l'organisation :</strong> Ville qui est le Halaka (ex: Douala - Halaka 16) ➔ Sous-Halaka (ex: Halaka 1, Secteur Bassa) ➔ Mosquée.
            </div>
            <div class="space-y-3">
              
              <!-- PAYS -->
              <details class="bg-white rounded-lg shadow overflow-hidden group">
                <summary class="p-4 bg-gray-50 hover:bg-gray-100 flex justify-between items-center transition-colors border-b border-transparent group-open:border-gray-200">
                  <span class="font-bold text-lg text-gray-800">🌍 1. Gérer les Pays</span>
                  <span class="text-emerald-600 text-xl font-bold"><span class="icon-plus">+</span><span class="icon-minus">−</span></span>
                </summary>
                <div class="p-4">
                  <div class="flex flex-col sm:flex-row gap-2 mb-4">
                    <input id="inp-pays" class="flex-1 border rounded px-3 py-2" placeholder="Ex: Cameroun">
                    <button onclick="addPays()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded">Ajouter le pays</button>
                  </div>
                  <div id="list-pays" class="space-y-2"></div>
                </div>
              </details>

              <!-- VILLES (HALAKAT) -->
              <details class="bg-white rounded-lg shadow overflow-hidden group">
                <summary class="p-4 bg-gray-50 hover:bg-gray-100 flex justify-between items-center transition-colors border-b border-transparent group-open:border-gray-200">
                  <span class="font-bold text-lg text-gray-800">🏙️ 2. Gérer les Villes (Halakat)</span>
                  <span class="text-emerald-600 text-xl font-bold"><span class="icon-plus">+</span><span class="icon-minus">−</span></span>
                </summary>
                <div class="p-4">
                  <div class="grid grid-cols-1 md:grid-cols-3 gap-2 mb-4">
                    <select id="inp-ville-pays" class="border rounded px-3 py-2"><option value="">-- Choisir le pays --</option></select>
                    <input id="inp-ville" class="border rounded px-3 py-2" placeholder="Ex: Douala (Halaka 16)">
                    <button onclick="addVille()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded">Ajouter la ville</button>
                  </div>
                  <div id="list-villes" class="space-y-2"></div>
                </div>
              </details>

              <!-- SOUS-HALAKAT -->
              <details class="bg-white rounded-lg shadow overflow-hidden group">
                <summary class="p-4 bg-gray-50 hover:bg-gray-100 flex justify-between items-center transition-colors border-b border-transparent group-open:border-gray-200">
                  <span class="font-bold text-lg text-gray-800">⭕ 3. Gérer les Sous-Halakat (Secteurs)</span>
                  <span class="text-emerald-600 text-xl font-bold"><span class="icon-plus">+</span><span class="icon-minus">−</span></span>
                </summary>
                <div class="p-4">
                  <div class="grid grid-cols-1 md:grid-cols-3 gap-2 mb-4">
                    <select id="inp-halaka-ville" class="border rounded px-3 py-2"><option value="">-- Choisir la ville --</option></select>
                    <input id="inp-halaka" class="border rounded px-3 py-2" placeholder="Ex: Halaka 1, Secteur Bassa...">
                    <button onclick="addHalaka()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded">Ajouter le sous-halaka</button>
                  </div>
                  <div id="list-halakat" class="space-y-2"></div>
                </div>
              </details>

              <!-- MOSQUÉES -->
              <details class="bg-white rounded-lg shadow overflow-hidden group">
                <summary class="p-4 bg-gray-50 hover:bg-gray-100 flex justify-between items-center transition-colors border-b border-transparent group-open:border-gray-200">
                  <span class="font-bold text-lg text-gray-800">🕌 4. Gérer les Mosquées</span>
                  <span class="text-emerald-600 text-xl font-bold"><span class="icon-plus">+</span><span class="icon-minus">−</span></span>
                </summary>
                <div class="p-4">
                  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-6 gap-2 mb-4">
                    <select id="inp-mos-halaka" class="border rounded px-3 py-2"><option value="">-- Choisir le sous-halaka --</option></select>
                    <input id="inp-mos-nom" class="border rounded px-3 py-2" placeholder="Ex: Mosquée Centrale">
                    <select id="inp-mos-ousboue" class="border rounded px-3 py-2"><option value="1">Ousboue 1</option><option value="2">Ousboue 2</option><option value="3">Ousboue 3</option><option value="4">Ousboue 4</option></select>
                    <input id="inp-mos-resp" class="border rounded px-3 py-2" placeholder="Responsable (optionnel)">
                    <input id="inp-mos-tel" class="border rounded px-3 py-2" placeholder="Téléphone (optionnel)">
                    <button onclick="addMosquee()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded">Ajouter</button>
                  </div>
                  <div id="list-mosquees" class="space-y-2"></div>
                </div>
              </details>

            </div>`;
          renderAdminLists();
        };

        window.renderAdminLists = function() {
          document.getElementById('list-pays').innerHTML = dataCache.pays.map(p => `<div class="flex justify-between items-center border rounded px-3 py-2"><span>${escapeHtml(p.nom)}</span><button onclick="deletePays(${p.id})" class="text-red-600 text-sm">Supprimer</button></div>`).join('') || '<p class="text-gray-500 text-sm">Aucun pays.</p>';
          
          const vp = document.getElementById('inp-ville-pays'); const prevVp = vp.value; 
          vp.innerHTML = '<option value="">-- Choisir le pays --</option>' + dataCache.pays.map(p => `<option value="${p.id}">${escapeHtml(p.nom)}</option>`).join(''); 
          if (prevVp && dataCache.pays.some(p => String(p.id) === prevVp)) vp.value = prevVp;
          
          document.getElementById('list-villes').innerHTML = dataCache.villes.map(v => { const p = dataCache.pays.find(x => String(x.id) === String(v.pays_id)); return `<div class="flex justify-between items-center border rounded px-3 py-2"><span>${escapeHtml(v.nom)} (${escapeHtml(p?.nom || '?')})</span><button onclick="deleteVille(${v.id})" class="text-red-600 text-sm">Supprimer</button></div>`; }).join('') || '<p class="text-gray-500 text-sm">Aucune ville.</p>';
          
          const hv = document.getElementById('inp-halaka-ville'); const prevHv = hv.value; 
          hv.innerHTML = '<option value="">-- Choisir la ville --</option>' + dataCache.villes.map(v => `<option value="${v.id}">${escapeHtml(v.nom)}</option>`).join(''); 
          if (prevHv && dataCache.villes.some(v => String(v.id) === prevHv)) hv.value = prevHv;
          
          document.getElementById('list-halakat').innerHTML = dataCache.halakat.map(h => { const v = dataCache.villes.find(x => String(x.id) === String(h.ville_id)); return `<div class="flex justify-between items-center border rounded px-3 py-2"><span>${escapeHtml(h.nom)} (${escapeHtml(v?.nom || '?')})</span><button onclick="deleteHalaka(${h.id})" class="text-red-600 text-sm">Supprimer</button></div>`; }).join('') || '<p class="text-gray-500 text-sm">Aucun sous-halaka.</p>';
          
          const mh = document.getElementById('inp-mos-halaka'); const prevMh = mh.value; 
          mh.innerHTML = '<option value="">-- Choisir le sous-halaka --</option>' + dataCache.halakat.map(h => `<option value="${h.id}">${escapeHtml(h.nom)}</option>`).join(''); 
          if (prevMh && dataCache.halakat.some(h => String(h.id) === prevMh)) mh.value = prevMh;
          
          document.getElementById('list-mosquees').innerHTML = dataCache.mosquees.map(m => { const h = dataCache.halakat.find(x => String(x.id) === String(m.halaka_id)); return `<div class="flex flex-col md:flex-row md:justify-between md:items-center gap-2 border rounded px-3 py-2"><div><span class="font-medium">${escapeHtml(m.nom)}</span> <span class="text-xs text-gray-500">(${escapeHtml(h?.nom || '?')})</span></div><div class="flex items-center gap-2"><select onchange="updateOusboue(${m.id}, this.value)" class="border rounded px-2 py-1 text-sm">${[1,2,3,4].map(n => `<option value="${n}" ${m.ousboue === n ? 'selected' : ''}>Ousboue ${n}</option>`).join('')}</select><button onclick="deleteMosquee(${m.id})" class="text-red-600 text-sm">Supprimer</button></div></div>`; }).join('') || '<p class="text-gray-500 text-sm">Aucune mosquée.</p>';
        };

        window.addPays = async () => { const nom = document.getElementById('inp-pays').value.trim(); if (!nom) return; await supabase.from('pays').insert({ nom }); document.getElementById('inp-pays').value = ''; await reloadDataAndRefresh(); };
        window.deletePays = async (id) => { if (!confirm('Supprimer ce pays et tout son contenu ?')) return; await supabase.from('pays').delete().eq('id', id); await reloadDataAndRefresh(); };
        window.addVille = async () => { const pays_id = document.getElementById('inp-ville-pays').value; const nom = document.getElementById('inp-ville').value.trim(); if (!pays_id || !nom) return; await supabase.from('villes').insert({ nom, pays_id }); document.getElementById('inp-ville').value = ''; await reloadDataAndRefresh(); };
        window.deleteVille = async (id) => { if (!confirm('Supprimer cette ville ?')) return; await supabase.from('villes').delete().eq('id', id); await reloadDataAndRefresh(); };
        window.addHalaka = async () => { const ville_id = document.getElementById('inp-halaka-ville').value; const nom = document.getElementById('inp-halaka').value.trim(); if (!ville_id || !nom) return; await supabase.from('halakat').insert({ nom, ville_id }); document.getElementById('inp-halaka').value = ''; await reloadDataAndRefresh(); };
        window.deleteHalaka = async (id) => { if (!confirm('Supprimer ce sous-halaka ?')) return; await supabase.from('halakat').delete().eq('id', id); await reloadDataAndRefresh(); };
        window.addMosquee = async () => { const halaka_id = document.getElementById('inp-mos-halaka').value; const nom = document.getElementById('inp-mos-nom').value.trim(); const ousboue = +document.getElementById('inp-mos-ousboue').value; const responsable = document.getElementById('inp-mos-resp').value.trim(); const contact = document.getElementById('inp-mos-tel').value.trim(); if (!halaka_id || !nom) return; await supabase.from('mosquees').insert({ nom, halaka_id, ousboue, responsable, contact }); document.getElementById('inp-mos-nom').value = ''; document.getElementById('inp-mos-resp').value = ''; document.getElementById('inp-mos-tel').value = ''; await reloadDataAndRefresh(); };
        window.deleteMosquee = async (id) => { if (!confirm('Supprimer cette mosquée ?')) return; await supabase.from('mosquees').delete().eq('id', id); await reloadDataAndRefresh(); };
        window.updateOusboue = async (id, value) => { await supabase.from('mosquees').update({ ousboue: +value }).eq('id', id); await reloadDataAndRefresh(); };

        window.switchTab = function(tab) {
          const isConsult = tab === 'consult';
          document.getElementById('view-consult').classList.toggle('hidden', !isConsult);
          document.getElementById('view-admin').classList.toggle('hidden', isConsult);
          const active = 'px-4 py-3 font-medium border-b-2 border-emerald-600 text-emerald-700'; const idle = 'px-4 py-3 font-medium border-b-2 border-transparent text-gray-500 hover:text-gray-800';
          document.getElementById('tab-consult').className = isConsult ? active : idle;
          document.getElementById('tab-admin').className = !isConsult ? active : idle;
        };

        loadData().then(() => {
          refreshConsultationSelects();
          initAdmin();
          
          document.getElementById('sel-pays').addEventListener('change', onPaysChange);
          document.getElementById('sel-ville').addEventListener('change', onVilleChange);
          document.getElementById('sel-halaka').addEventListener('change', renderPlanning);
          document.getElementById('sel-annee').addEventListener('change', renderPlanning);
          document.getElementById('sel-mois').addEventListener('change', renderPlanning);
          
          document.getElementById('btn-print').addEventListener('click', () => window.print());
          document.getElementById('btn-whatsapp').addEventListener('click', () => {
            const halakaId = document.getElementById('sel-halaka').value;
            if (!halakaId) return;
            const year = +document.getElementById('sel-annee').value; const month = +document.getElementById('sel-mois').value;
            const halaka = dataCache.halakat.find(h => String(h.id) === halakaId); const ville = dataCache.villes.find(v => String(v.id) === String(halaka.ville_id)); const pays = dataCache.pays.find(p => String(p.id) === String(ville.pays_id));
            let txt = `🕌 *Programme des sorties 3 jours*\n📍 ${pays.nom} — ${ville.nom} (Halaka)\n⭕ ${halaka.nom} (Sous-Halaka)\n🗓️ ${MONTHS[month - 1]} ${year}\n\n`;
            dataCache.mosquees.filter(m => String(m.halaka_id) === halakaId).sort((a, b) => a.ousboue - b.ousboue).forEach((m, i) => { const { friday, sunday } = getOusboueDates(year, month, m.ousboue); txt += `${i + 1}. *${m.nom}* — Ousboue ${m.ousboue}\n   📅 ${formatLongDate(friday)} → ${formatLongDate(sunday)}\n`; });
            txt += `\nبارك الله فيكم`;
            if (navigator.clipboard) { navigator.clipboard.writeText(txt).then(() => alert('✅ Texte copié !')).catch(() => prompt('Copiez ce texte :', txt)); } else { prompt('Copiez ce texte :', txt); }
          });
        });

      } catch (err) { showError("Erreur d'initialisation : " + err.message); }
    };

    script.onerror = () => { showError("Votre réseau bloque Supabase. Essayez avec un autre réseau."); };
    document.body.appendChild(script);
  </script>
</body>
</html>
